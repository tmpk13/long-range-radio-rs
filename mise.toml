# Every task runs from the repository root.  Arguments after the task name
# are appended to its command, e.g. `mise run flash --features board`.
#
# The Rust toolchain comes from rust-toolchain.toml through rustup; probe-rs
# and OpenOCD are the machine's own installs.

[tools]
# Python and the basestation host tools' packages come from pixi.toml.
pixi = "0.66.0"

[tasks.build]
description = "Build the node firmware, bootloader and basestation (release) without flashing"
# One cargo call per package: building several members at once unifies
# cortex-m-rt's features, and the bootloader then fails to link (no device.x).
run = [
    "cargo build --release -p sx1262-mesh-rs",
    "cargo build --release -p bootloader",
    "cargo build --release -p basestation",
]

[tasks.check]
description = "Build every node feature set, the bootloader and both basestation variants into target/check, to catch feature-gated breakage"
# Its own target directory keeps target/thumbv7em-none-eabi/release/ holding
# the images last built for flashing, which `mise run attach` reads.
env = { CARGO_TARGET_DIR = "target/check" }
run = [
    "cargo build --release -q -p sx1262-mesh-rs",
    "cargo build --release -q -p sx1262-mesh-rs --features debug",
    "cargo build --release -q -p sx1262-mesh-rs --features board",
    "cargo build --release -q -p sx1262-mesh-rs --features sensor",
    "cargo build --release -q -p sx1262-mesh-rs --features rs422",
    "cargo build --release -q -p sx1262-mesh-rs --features gps-radio-log",
    "cargo build --release -q -p sx1262-mesh-rs --features board,sensor,rs422,debug",
    "cargo build --release -q -p sx1262-mesh-rs --features board,sensor,gps-radio-log",
    "cargo build --release -q -p bootloader",
    "cargo build --release -q -p basestation",
    "cargo build --release -q -p basestation --features board",
]

[tasks.test]
description = "Run the host-side tests, no hardware needed: flash-layout's partition map and its boot log and swap under power cuts, the firmware's supervisor and reset classification, and the unlock-check verdicts"
# The root .cargo/config.toml targets the MCU, so host tests name the host.
run = [
    'cargo test -q -p flash-layout --lib --target "$(rustc -vV | sed -n "s/^host: //p")"',
    'cargo test -q -p sx1262-mesh-rs --lib --target "$(rustc -vV | sed -n "s/^host: //p")"',
    "bash scripts/unlock-check-test.sh",
]

[tasks.bootloader]
description = "Flash the bootloader through probe-rs; once per board, no RTT output, Ctrl-C once flashed"
run = "cargo run --release -p bootloader"

[tasks.flash]
description = "Build, flash and attach RTT to a mesh node; ADDRESS, LORA_PRESET, FW_VERSION and RX_BOOST come from the environment, extra args go to cargo"
run = "cargo run --release -p sx1262-mesh-rs"

[tasks.attach]
description = "Attach probe-rs RTT to a running mesh node"
run = "probe-rs attach --chip STM32WLE5JCIx --rtt-scan-memory target/thumbv7em-none-eabi/release/sx1262-mesh-rs"

[tasks.basestation]
description = "Build, flash and attach RTT to the basestation node; set ADDRESS (e.g. 10)"
run = "cargo run --release -p basestation"

[tasks.ota-image]
description = "Build target/firmware.bin for ota-upload; set the target node's ADDRESS and a higher FW_VERSION, and pass its cargo features (e.g. --features board)"
run = "bash scripts/ota-image.sh"

[tasks.ota-upload]
description = "Upload a firmware image to a node through the basestation (args: -p PORT -t TARGET -v VERSION FILE)"
run = "pixi run python basestation/host/ota_upload.py"

[tasks.data-relay]
description = "Relay mesh data from the basestation as JSON lines (args: -p PORT)"
run = "pixi run python basestation/host/data_relay.py"

[tasks.unlock]
description = "Clear STM32WLE5 read protection with OpenOCD over a CMSIS-DAP probe (erases flash); power-cycle the board afterwards, then mise run unlock-check"
run = 'openocd -f interface/cmsis-dap.cfg -f target/stm32wlx.cfg -c "init; reset halt; stm32l4x unlock 0; reset halt; exit"'

[tasks.unlock-check]
description = "Report the STM32WLE5's read protection level through probe-rs, and whether an unlock still awaits a power cycle; exits 0 only when unlocked"
run = "bash scripts/unlock-check.sh"
