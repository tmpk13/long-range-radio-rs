[workspace]
members = ["firmware", "bootloader", "basestation"]
# A plain `cargo build` or `cargo run` here builds the mesh node firmware
# alone.  Building all members in one call does not link: cargo unifies
# cortex-m-rt's features across them, and the bootloader, which has no HAL
# to supply a device.x, then fails to link.  Build one package per call.
default-members = ["firmware"]
resolver = "3"

[profile.dev]
# Unoptimized code is too slow for the radio timing, so debug builds are
# optimized for size as well.
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'thin'
opt-level        = 's'
overflow-checks  = false
