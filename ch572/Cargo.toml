[package]
edition      = "2024"
name         = "ch572-bridge"
rust-version = "1.88"
version      = "0.1.0"
description  = "CH572D firmware for the Forest Sensor Platform: USB serial bridge and CMSIS-DAP probe for the Wio-E5"

# A workspace of its own: the parent workspace builds for thumbv7em, this
# crate for riscv32imc (see .cargo/config.toml next to this file).
[workspace]

[lib]
name = "ch572_bridge"
path = "src/lib.rs"

[[bin]]
name  = "ch572-bridge"
path  = "src/main.rs"
test  = false
bench = false

[dependencies]
# bool: the firmware's implementation saves and restores mstatus.MIE.
critical-section = { version = "1.2", features = ["restore-state-bool"] }
dap-rs           = "0.2"
embedded-hal     = "1.0"
usb-device       = "0.3.2"
usbd-serial      = "0.2.2"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[profile.dev]
# Unoptimized SWD bit-banging and USB polling are too slow to be useful.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = true
opt-level     = "s"
