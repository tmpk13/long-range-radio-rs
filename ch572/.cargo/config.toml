# The CH572 core is a QingKe V3C (RV32IMBC, no atomics), so the plain
# imc target applies.  This value overrides the parent directory's
# thumbv7em target; host tests pass --target explicitly (mise run
# ch572-test).
[build]
target = "riscv32imc-unknown-none-elf"

# The CH572D's ROM bootloader over USB, through isp.py: wchisp reports
# success on this chip while writing nothing (see isp.py and
# notes/ch572.md).  isp.py waits 30 s for the bootloader.  The path is
# relative, so run cargo from this directory (mise run ch572-flash does).
[target.riscv32imc-unknown-none-elf]
runner = "pixi exec -s python=3.12 -s pyusb -s libusb python -I isp.py --wait 30"
